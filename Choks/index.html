<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Time Calculator | Flight Briefing Pack</title>
  <link rel="icon" href="../favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="../favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="../favicon-16x16.png">
  <link rel="apple-touch-icon" href="../apple-touch-icon.png">
  <link rel="stylesheet" href="../assets/css/fbp-shared.css">
  <link rel="stylesheet" href="../assets/css/choks.css">
</head>
<body class="fbp-theme" data-fbp-version="v3">
  <main id="fbp-page" class="fbp-shell">
    <section class="choks-content fbp-panel">
      <h2>Report time and maximum FDP</h2>
      <div class="choks-grid">
        <div>
          <label for="rh">Report time</label>
          <div class="timegrid">
            <input id="rh" inputmode="numeric" maxlength="2" placeholder="HH" aria-label="Report time hours">
            <input id="rm" inputmode="numeric" maxlength="2" placeholder="MM" aria-label="Report time minutes">
          </div>
        </div>
        <div>
          <label for="fh">Maximum FDP</label>
          <div class="timegrid">
            <input id="fh" inputmode="numeric" maxlength="2" placeholder="HH" aria-label="Maximum FDP hours">
            <input id="fm" inputmode="numeric" maxlength="2" placeholder="MM" aria-label="Maximum FDP minutes">
          </div>
        </div>
      </div>
      <div class="choks-result" aria-live="polite">
        <h3>Latest finish time</h3>
        <output id="out">--:--</output>
      </div>
    </section>
  </main>

  <script src="../assets/js/fbp-shared.js"></script>
  <script src="../assets/js/fbp-nav.js"></script>
  <script src="../assets/js/fbp-shell.js"></script>
  <script src="../assets/js/fbp-page.js"></script>
  <script>
    FBP.createPage({
      title: "Time Calculator",
      subtitle: "Add a maximum FDP duration to a report time.",
      microline: "Flight Briefing Pack",
      activePage: "choks",
      feedbackSubject: "Feedback for Time Calculator"
    });

    const rh = document.getElementById("rh");
    const rm = document.getElementById("rm");
    const fh = document.getElementById("fh");
    const fm = document.getElementById("fm");
    const out = document.getElementById("out");

    function calculateFinishTime() {
      const values = [rh, rm, fh, fm].map((field) => Number.parseInt(field.value, 10));
      if (values.some(Number.isNaN)) {
        out.textContent = "--:--";
        return;
      }

      const [reportHours, reportMinutes, fdpHours, fdpMinutes] = values;
      const total = ((reportHours * 60 + reportMinutes + fdpHours * 60 + fdpMinutes) % 1440 + 1440) % 1440;
      out.textContent = `${String(Math.floor(total / 60)).padStart(2, "0")}:${String(total % 60).padStart(2, "0")}`;
    }

    [rh, rm, fh, fm].forEach((field) => field.addEventListener("input", calculateFinishTime));
  </script>
</body>
</html>
